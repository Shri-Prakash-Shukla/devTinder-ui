<div class="hero bg-base-100">
    <div class="hero-content flex-col lg:flex-row-reverse">
      <div class="card bg-base-200 w-full max-w-sm shrink-0 shadow-2xl">
        <form class="card-body">
         <!-- First Name   -->
          @if (!onLoginPage) {
            <div class="form-control">
              <label class="label">
                <span class="label-text">First Name</span>
              </label>
              <input 
              type="text" 
              placeholder="First Name" 
              class="input input-bordered" 
              name = "firstName"
              [(ngModel)] = 'firstName'
              required />
            </div>
            <!-- Last Nmae -->
            <div class="form-control">
              <label class="label">
                <span class="label-text">Last Name</span>
              </label>
              <input 
              type="text" 
              placeholder="Last Name" 
              class="input input-bordered" 
              name = "lastName"
              [(ngModel)] = 'lastName'
              required />
            </div>
            <!-- Age -->
            <div class="form-control">
              <label class="label">
                <span class="label-text">Age</span>
              </label>
              <input 
              type="text" 
              placeholder="Age" 
              class="input input-bordered" 
              name = "age"
              [(ngModel)] = 'age'
              required />
            </div>
            <!-- Gender -->
            <div class="form-control">
              <label class="label">
                <span class="label-text">Gender</span>
              </label>
              <input 
              type="text" 
              placeholder="Gender" 
              class="input input-bordered" 
              name = "gender"
              [(ngModel)] = 'gender'
              required />
            </div>
          }
          <!-- Email -->
          <div class="form-control">
            <label class="label">
              <span class="label-text">Email</span>
            </label>
            <input 
            type="email" 
            placeholder="email" 
            class="input input-bordered" 
            name = "email"
            [(ngModel)] = 'loginObj.emailId'
            required />
          </div>
          <!-- Password -->
          <div class="form-control">
            <label class="label">
              <span class="label-text">Password</span>
            </label>
            <input 
            type="password" 
            placeholder="password" 
            class="input input-bordered" 
            name = "password"
            [(ngModel)] = 'loginObj.password'
            required />
            <label class="label flex flex-col items-start gap-2">
              @if(!onLoginPage){
                <span class="label-text-alt">
                  Already a user? 
                  <button 
                    type="button" 
                    (click)="onLoginPage = true" 
                    class="link link-hover text-primary font-bold"
                  >
                    Login
                  </button>
                </span>
              }
              @else {
                <span class="label-text-alt">
                  New User? 
                  <button 
                    type="button" 
                    (click)="onLoginPage = false" 
                    class="link link-hover text-primary font-bold"
                  >
                    Sign Up
                  </button>
                </span>
              }
            </label>
          </div>
          <div class="form-control mt-3">
            @if(errorMessage){
              <p class="text-red-500 my-2 text-center">{{errorMessage}}</p>
            }
            @if(!onLoginPage){
              <button class="btn btn-primary" (click) = 'onSignUp()' >Sign Up</button>
            }
            @else {
              <button class="btn btn-primary" (click) = 'onLogin()' >Login</button>
            }
          </div>

          <div class="divider text-xs text-base-content/50">OR</div>

          <button type="button" class="btn btn-outline w-full gap-2" (click)="onGoogleLogin()">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" class="w-5 h-5">
              <path fill="#EA4335" d="M24 9.5c3.14 0 5.95 1.08 8.17 2.85l6.08-6.08C34.36 3.05 29.44 1 24 1 14.82 1 7.07 6.48 3.6 14.22l7.1 5.52C12.4 13.67 17.73 9.5 24 9.5z"/>
              <path fill="#4285F4" d="M46.52 24.5c0-1.64-.15-3.22-.42-4.75H24v9h12.7c-.55 2.96-2.2 5.47-4.68 7.16l7.19 5.59C43.27 37.36 46.52 31.36 46.52 24.5z"/>
              <path fill="#FBBC05" d="M10.7 28.74A14.6 14.6 0 0 1 9.5 24c0-1.65.28-3.25.78-4.74l-7.1-5.52A23.93 23.93 0 0 0 0 24c0 3.87.92 7.53 2.55 10.77l8.15-6.03z"/>
              <path fill="#34A853" d="M24 47c5.44 0 10.01-1.8 13.35-4.89l-7.19-5.59C28.38 38.25 26.3 39 24 39c-6.27 0-11.6-4.17-13.3-9.74l-8.15 6.03C6.07 43.28 14.45 47 24 47z"/>
            </svg>
            Continue with Google
          </button>
        </form>
      </div>
    </div>
  </div>
