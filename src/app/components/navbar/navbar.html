<div class="navbar bg-neutral shadow-sm">
    <div class="flex flex-1 justify-between">
      <a class="btn btn-ghost text-xl" routerLink="/">DevTinder</a>
      @if(firstName){
        <p class="mx-2">Welcome, {{firstName}}</p>
      }
    </div>
    @if(isLoggedIn){
    <div class="flex gap-2">
      <div class="dropdown dropdown-end">
        <div tabindex="0" role="button" class="btn btn-ghost btn-circle avatar">
          <div class="w-10 rounded-full">
            <img
              alt="Tailwind CSS Navbar component"
              src={{photoUrl}} />
          </div>
        </div>
        <ul
          tabindex="-1"
          class="menu menu-sm dropdown-content bg-base-200 rounded-box z-1 mt-3 w-52 p-2 shadow">
          <li>
            <a class="justify-between" routerLink="/profile">
              Profile
            </a>
          </li>
          <li><a routerLink="/connections">Connections</a></li>
          <li><a routerLink="/requests">Requests</a></li>
          <li><a (click)="supportUs()">Support Us ❤️</a></li>
          <li><a (click)="logout()">Logout</a></li>
        </ul>
      </div>
    </div>
    }
  
  </div>
